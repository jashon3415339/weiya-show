<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浤議科技 2026 尾牙・主持大螢幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c451;--gold2:#ffe7a0;--red:#b3141d;--deep:#2a0507;--p:0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;user-select:none}
#sky{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#a3131b 0%,#5a080d 45%,#1c0305 100%);transition:filter .3s}
#sky::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 100%,rgba(255,170,40,calc(var(--p)*.55)),transparent 70%);}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:5}body.big #fx{z-index:8}#amb{z-index:1}
.wrap{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;padding:3vh 4vw 0}
body.shake .wrap{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--sh)*1px),calc(var(--sh)*-1px))}50%{transform:translate(calc(var(--sh)*-1px),calc(var(--sh)*.6px))}75%{transform:translate(calc(var(--sh)*.7px),calc(var(--sh)*1px))}}
.lantern{position:fixed;top:-2vh;z-index:2;width:7vh;transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite}
.lantern.r{right:3vw;animation-delay:-1.7s}.lantern.l{left:3vw}
.lantern i{display:block;margin:0 auto;width:.25vh;height:5vh;background:#e6b84a}
.lantern b{display:block;height:9vh;border-radius:45%;background:radial-gradient(circle at 50% 40%,#ff6a3d,#d0101c 60%,#7a0610);box-shadow:0 0 calc(3vh + var(--p)*6vh) rgba(255,120,40,.8);position:relative}
.lantern b::after{content:"福";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 4vh "Noto Serif TC";color:var(--gold)}
.lantern u{display:block;margin:0 auto;width:2.4vh;height:3vh;background:linear-gradient(#f5c451,transparent);clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}
@keyframes swing{50%{transform:rotate(6deg)}0%,100%{transform:rotate(-6deg)}}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:0 8vh}
header .co{font:700 2.4vh "Noto Sans TC";letter-spacing:.3em;color:var(--gold2);opacity:.9}
header .ti{font:900 4.6vh "Noto Serif TC";color:var(--gold);text-shadow:0 .4vh 0 #5a080d}
header .meta{font-size:2vh;opacity:.75;text-align:right}
.flow{display:flex;gap:.5vw;margin:2.6vh 0 0;justify-content:center;flex-wrap:nowrap}
.flow div{flex:1;max-width:12vw;min-width:0;text-align:center;padding:1vh .3vw;border-radius:1.2vh;font-size:1.6vh;line-height:1.3;background:rgba(0,0,0,.25);border:.15vh solid rgba(245,196,81,.25);color:rgba(255,255,255,.55);transition:all .5s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow div small{display:block;font-size:1.3vh;opacity:.8}
.flow div.done{color:var(--gold2);border-color:rgba(245,196,81,.6);background:rgba(245,196,81,.12)}
.flow div.now{color:#5a080d;background:linear-gradient(var(--gold2),var(--gold));border-color:var(--gold);transform:translateY(-.6vh) scale(1.08);box-shadow:0 0 3vh rgba(255,200,80,.7);font-weight:900}
.flow div.grand{border-style:dashed}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
.card{animation:cardIn .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(6vh) scale(.85);filter:blur(1vh)}}
.card .time{display:inline-block;font:900 3vh "Noto Sans TC";letter-spacing:.1em;color:#5a080d;background:var(--gold);padding:.6vh 2.4vh;border-radius:99px;margin-bottom:2.4vh}
.card .icon{font-size:13vh;line-height:1;display:block;margin-bottom:1vh;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 1vh 2vh rgba(0,0,0,.4))}
@keyframes bob{50%{transform:translateY(-1.6vh) rotate(4deg)}}
.card h1{margin:0;font:900 13vh/1.1 "Noto Serif TC";background:linear-gradient(180deg,#fff6d6 10%,#f5c451 55%,#c98a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .6vh 0 #5a080d)}
.card .ml{font-size:2.8vh;opacity:.8;margin-top:1.4vh;letter-spacing:.05em}
.card .desc{font-size:3.2vh;margin-top:2.4vh;color:var(--gold2)}
.card .tag{display:inline-block;margin-top:2vh;font-size:2vh;padding:.4vh 1.6vh;border:.15vh solid rgba(255,255,255,.4);border-radius:99px;opacity:.7}
.card.hasRules .icon{font-size:7vh;margin-bottom:.4vh}
.card.hasRules .time{margin-bottom:1.4vh}
.card.hasRules h1{font-size:8vh}
.card.hasRules .ml{margin-top:.8vh}
.card.hasRules .desc{display:none}
.rules{list-style:none;counter-reset:r;margin:3vh auto 0;padding:0;display:inline-block;text-align:left}
/* ===== 三種氛圍：mood-dine 用餐／mood-draw 抽獎／mood-game 遊戲 ===== */
#meter,#goal{display:none!important}
.layer{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s ease}
#skyDraw{background:radial-gradient(110% 90% at 50% 42%,#e2321f 0%,#9a0d14 42%,#2e0307 100%)}
#skyGame{background:radial-gradient(130% 110% at 50% 55%,#4a0b24 0%,#1c0614 50%,#06020b 100%)}
body.mood-draw #skyDraw,body.mood-game #skyGame{opacity:1}
/* 抽獎：背後旋轉的金色光芒 */
#rays{z-index:1;display:flex;align-items:center;justify-content:center}
#rays i{width:170vmax;height:170vmax;flex:none;background:repeating-conic-gradient(rgba(255,214,90,.20) 0 7deg,transparent 7deg 20deg);animation:spin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 8%,transparent 58%);mask:radial-gradient(circle,#000 8%,transparent 58%)}
body.mood-draw #rays{opacity:1}
/* 遊戲：斜向速度線＋脈動霓虹框 */
#speed{z-index:1;background:repeating-linear-gradient(105deg,transparent 0 7vw,rgba(255,190,70,.07) 7vw 7.25vw,transparent 7.25vw 11vw,rgba(255,70,120,.06) 11vw 11.2vw);background-size:200% 100%;animation:speed 2.2s linear infinite}
@keyframes speed{to{background-position:-60vw 0}}
body.mood-game #speed{opacity:1}
/* 用餐：底部祥雲緩緩飄動 */
#clouds{z-index:2}
#clouds svg{position:absolute;bottom:-2vh;width:46vw;height:auto;opacity:.5;animation:drift 18s ease-in-out infinite alternate}
#clouds svg.l{left:-6vw}#clouds svg.r{right:-6vw;transform:scaleX(-1);animation-delay:-9s}
@keyframes drift{to{translate:4vw -1vh}}
body.mood-dine #clouds,body.mood-draw #clouds{opacity:1}
/* 金色外框 */
#frame{z-index:4;opacity:1;inset:1.4vh;border:.35vh solid rgba(245,196,81,.55);border-radius:2.2vh;box-shadow:inset 0 0 3vh rgba(245,196,81,.18),0 0 2vh rgba(245,196,81,.15)}
#frame::before,#frame::after{content:"";position:absolute;width:9vh;height:9vh;border:.6vh solid var(--gold);border-radius:1.2vh}
#frame::before{left:-.9vh;top:-.9vh;border-right:0;border-bottom:0}
#frame::after{right:-.9vh;bottom:-.9vh;border-left:0;border-top:0}
body.mood-game #frame{border-color:rgba(255,90,140,.7);animation:pulse 1.1s ease-in-out infinite}
body.mood-game #frame::before,body.mood-game #frame::after{border-color:#ff6aa0}
@keyframes pulse{50%{box-shadow:inset 0 0 6vh rgba(255,80,140,.35),0 0 4vh rgba(255,80,140,.4)}}
/* 鞭炮串（抽獎時出現在燈籠旁） */
.crackers{position:fixed;top:0;z-index:2;width:2.4vh;height:34vh;transform-origin:50% 0;animation:swing 2.6s ease-in-out infinite;opacity:0;transition:opacity 1s;
  background:linear-gradient(90deg,transparent 45%,#e6b84a 45% 55%,transparent 55%) 0 0/100% 100% no-repeat,repeating-linear-gradient(180deg,#d0101c 0 3vh,#f5c451 3vh 3.4vh,transparent 3.4vh 4.2vh);border-radius:.6vh}
.crackers.l{left:12vw;animation-delay:-.8s}.crackers.r{right:12vw;animation-delay:-2s}
body.mood-draw .crackers{opacity:1}
body.mood-game .lantern{opacity:.35;transition:opacity 1s}
/* 氛圍標籤 */
#moodTag{position:fixed;left:50%;top:3.2vh;transform:translateX(-50%);z-index:4;font:900 2.2vh "Noto Sans TC";letter-spacing:.3em;padding:.7vh 2.6vh;border-radius:99px;color:#5a080d;background:linear-gradient(var(--gold2),var(--gold));box-shadow:0 0 2.5vh rgba(255,200,80,.5);transition:all .6s}
body.mood-game #moodTag{color:#fff;background:linear-gradient(#ff5d8f,#c2185b);box-shadow:0 0 3vh rgba(255,80,140,.7)}
body.mood-dine #moodTag{background:rgba(0,0,0,.35);color:var(--gold2);box-shadow:none;border:.15vh solid rgba(245,196,81,.45)}
/* 卡片：圖示放進金色圓章、說明放進紅色緞帶 */
.card .icon{display:inline-flex;align-items:center;justify-content:center;width:22vh;height:22vh;border-radius:50%;font-size:12vh;margin:0 auto 1.6vh;background:radial-gradient(circle at 50% 35%,#fff3c4,#f5c451 55%,#b8770f);box-shadow:0 0 0 .8vh rgba(255,231,160,.35),0 0 0 1.6vh rgba(179,20,29,.55),0 1.5vh 4vh rgba(0,0,0,.45)}
body.mood-dine .card .icon{background:radial-gradient(circle at 50% 35%,#fff8e6,#f1d79a 60%,#c99a45);width:19vh;height:19vh;font-size:10.5vh;animation-duration:3.6s}
body.mood-game .card .icon{background:radial-gradient(circle at 50% 35%,#5a1030,#2a0716 70%);box-shadow:0 0 0 .6vh #ff6aa0,0 0 4vh rgba(255,80,140,.8);animation:beat .55s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.card .desc{display:inline-block;padding:1.1vh 6vh;background:linear-gradient(90deg,transparent,rgba(179,20,29,.9) 12%,rgba(179,20,29,.9) 88%,transparent)}
body.mood-game .card .desc{background:linear-gradient(90deg,transparent,rgba(194,24,91,.85) 12%,rgba(194,24,91,.85) 88%,transparent)}
body.mood-draw .card h1{background:linear-gradient(110deg,#fff6d6 20%,#f5c451 40%,#fffbe8 50%,#f5c451 60%,#c98a1a 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 2.6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
body.mood-game .card h1{background:linear-gradient(180deg,#fff 10%,#ffd1e2 50%,#ff5d8f);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 .5vh 0 #3a0a1a) drop-shadow(0 0 2.5vh rgba(255,80,140,.6))}
body.mood-dine .card h1{font-size:11vh}
/* 頭獎集氣：中間的能量圈（取代原本下方的讀取條） */
#charge{position:fixed;left:50%;top:50%;z-index:6;width:46vh;height:46vh;margin:-23vh 0 0 -23vh;border-radius:50%;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:conic-gradient(#ffd23f calc(var(--p)*360deg),rgba(0,0,0,.45) 0);box-shadow:0 0 calc(4vh + var(--p)*10vh) rgba(255,170,40,.9)}
#charge::before{content:"";position:absolute;inset:3vh;border-radius:50%;background:radial-gradient(circle,#7a0a10,#2a0306)}
#charge b{position:relative;font:900 14vh/1 "Noto Serif TC";color:#fff;text-shadow:0 0 3vh #ffb21e}
#charge small{position:relative;font:900 2.6vh "Noto Sans TC";color:var(--gold2);letter-spacing:.3em;margin-top:1vh}
body.charging #charge{display:flex}
body.charging main{visibility:hidden}
body.noFlow .flow{display:none}
body.noTime .card .time{display:none}
body.rulesOn #meter,body.rulesOn #goal{display:none}
body.rulesOn main{padding-bottom:3vh}
.rules li{counter-increment:r;position:relative;padding:1vh 2vh 1vh 8vh;margin-bottom:1.2vh;border-radius:1.6vh;background:rgba(0,0,0,.32);border:.15vh solid rgba(245,196,81,.35);font:900 3.4vh/1.35 "Noto Sans TC";color:#fff}
.rules li::before{content:counter(r);position:absolute;left:1.8vh;top:50%;transform:translateY(-50%);width:4.6vh;height:4.6vh;border-radius:50%;background:linear-gradient(var(--gold2),var(--gold));color:#5a080d;font:900 3vh/4.6vh "Noto Sans TC";text-align:center}
.rules li small{display:block;font:400 1.9vh/1.4 "Noto Sans TC";color:var(--gold2);opacity:.85;margin-top:.3vh}
#meter{position:relative;margin:0 auto 5vh;width:76vw}
#meter .lab{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.2vh;font-weight:900}
#meter .lab span{font:900 3.2vh "Noto Serif TC";color:var(--gold)}
#meter .lab span small{font:700 1.8vh "Noto Sans TC";color:#fff;opacity:.7;margin-left:1vh}
#meter .lab b{font-size:5vh;color:#fff;text-shadow:0 0 2vh rgba(255,180,40,.9);font-variant-numeric:tabular-nums}
.bar{position:relative;height:6.4vh;border-radius:4vh;background:rgba(0,0,0,.55);border:.5vh solid var(--gold);box-shadow:0 0 calc(2vh + var(--p)*7vh) rgba(255,170,40,calc(.35 + var(--p)*.6)),inset 0 0 2vh #000;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4vh;background:linear-gradient(90deg,#ffe7a0,#ffb21e 35%,#ff5a1f 70%,#ff1f6a);box-shadow:0 0 3vh #ff9a1f}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 1.4vh,transparent 1.4vh 3.6vh);animation:st .8s linear infinite}
@keyframes st{to{background-position:3.9vh 0}}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{position:absolute;top:0;bottom:0;width:.25vh;background:rgba(255,255,255,.25)}
.goal{position:absolute;right:-1vh;top:50%;transform:translate(50%,-50%);font-size:6vh;z-index:2;animation:goalP 1.2s ease-in-out infinite;filter:drop-shadow(0 0 2vh #ffd24a)}
@keyframes goalP{50%{transform:translate(50%,-50%) scale(1.18)}}
#meter .hintline{text-align:center;font-size:2vh;margin-top:1.2vh;opacity:.75;min-height:2.6vh}
#count{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;font:900 40vh "Noto Serif TC";color:#fff;text-shadow:0 0 6vh #ffb21e,0 0 12vh #ff3d00}
#count span{animation:cnt .9s ease-out forwards}
@keyframes cnt{from{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}to{transform:scale(.6);opacity:0}}
#flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl 1.4s ease-out}
@keyframes fl{0%{opacity:0}6%{opacity:1}100%{opacity:0}}
#grand{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle,rgba(90,8,13,.2),rgba(20,2,3,.85) 70%)}
#grand.on{display:flex}
#grand .rays{position:absolute;width:180vmax;height:180vmax;left:50%;top:50%;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,210,80,.22) 0 6deg,transparent 6deg 18deg);animation:spin 22s linear infinite;mask:radial-gradient(circle,#000 10%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
#grand .g1{position:relative;font:900 4.4vh "Noto Sans TC";letter-spacing:.6em;color:var(--gold2);animation:up .8s .2s both}
#grand .g2{position:relative;font:900 30vh/1 "Noto Serif TC";background:linear-gradient(180deg,#fff 5%,#ffe08a 40%,#f2a51c 70%,#b8650c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1.4vh 0 #5a080d) drop-shadow(0 0 6vh rgba(255,190,40,.8));animation:boom 1.1s cubic-bezier(.2,1.8,.4,1) both}
@keyframes boom{from{transform:scale(0) rotate(-12deg)}}
#grand .g3{position:relative;margin-top:2vh;font:900 6vh "Noto Sans TC";padding:1.6vh 6vh;border-radius:2vh;background:linear-gradient(135deg,#ffe08a,#f2b632);color:#7a0f12;box-shadow:0 0 6vh rgba(255,215,106,.8);animation:up .8s .7s both}
#grand .g4{position:relative;margin-top:3vh;font-size:3vh;opacity:.85;animation:up .8s 1.1s both}
@keyframes up{from{opacity:0;transform:translateY(5vh)}}
#help{position:fixed;left:50%;bottom:.6vh;transform:translateX(-50%);z-index:10;font-size:1.5vh;opacity:.35;white-space:nowrap}
#tools{position:fixed;right:1vh;bottom:1vh;z-index:11;display:flex;gap:.6vh;opacity:.15;transition:opacity .3s}
#tools:hover{opacity:1}
#tools button{font:700 1.6vh "Noto Sans TC";padding:.8vh 1.4vh;border-radius:1vh;border:.15vh solid var(--gold);background:rgba(0,0,0,.6);color:var(--gold2);cursor:pointer}
#rbadge{position:fixed;left:1.4vh;bottom:1.4vh;z-index:4;font-size:1.6vh;padding:.5vh 1.3vh;border-radius:99px;background:rgba(0,0,0,.35);border:.15vh solid rgba(245,196,81,.3);color:var(--gold2);opacity:.55}
#rbadge i{display:inline-block;width:1vh;height:1vh;border-radius:50%;background:#888;margin-right:.7vh;vertical-align:.05vh}
#rbadge.ok i{background:#3ddc84}#rbadge.bad i{background:#ff4d4d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#cine{position:fixed;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s ease;display:flex;align-items:center;justify-content:center}
#cine.on{opacity:1;pointer-events:auto}
#vid{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 2s ease}
#vid.on{opacity:1}
#cinePh{position:absolute;opacity:0;transition:opacity 2s;text-align:center;font-size:4vh;line-height:1.8;color:var(--gold2)}#cinePh.on{opacity:1}
#cinePh small{font-size:2.2vh;opacity:.7}
#cineHint{position:absolute;bottom:4vh;font-size:2vh;opacity:.6}
/* 遊戲層 */
#gameLayer{position:fixed;inset:0;z-index:30;background:#000;visibility:hidden;opacity:0;transition:opacity .6s,visibility 0s .6s;pointer-events:none}
#gameLayer.on{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .6s}
#gameLayer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;background:#000}
#gameLayer.on iframe.cur{visibility:visible}
#gExit{position:absolute;left:1vh;top:1vh;z-index:2;font:700 1.6vh "Noto Sans TC";padding:.7vh 1.3vh;border-radius:1vh;border:.15vh solid var(--gold);background:rgba(0,0,0,.6);color:var(--gold2);cursor:pointer;opacity:0;transition:opacity .3s}
#gExit:hover{opacity:1}
/* 開始畫面 */
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#4a070c,#140203 75%)}
#gate.off{display:none}
.gbox{width:min(92vw,560px);text-align:center;padding:4vh 4vh 3vh;border-radius:2.4vh;background:rgba(0,0,0,.45);border:.2vh solid rgba(245,196,81,.5)}
.gbox h2{margin:0 0 .6vh;font:900 4.4vh "Noto Serif TC";color:var(--gold)}
.gbox p{margin:.8vh 0;font-size:2vh;opacity:.85;line-height:1.6}
.gbox input{display:block;width:100%;margin:1.2vh 0;padding:1.4vh 1.6vh;font:2.2vh "Noto Sans TC";border-radius:1.2vh;border:.15vh solid rgba(245,196,81,.5);background:rgba(0,0,0,.5);color:#fff}
.gbox button{font:900 2.4vh "Noto Sans TC";padding:1.5vh 3vh;border-radius:1.4vh;border:0;cursor:pointer;margin:1vh .5vh 0}
.gbox .pri{background:linear-gradient(var(--gold2),var(--gold));color:#5a080d;width:100%;font-size:3vh;padding:2vh}
.gbox .sec{background:transparent;color:var(--gold2);border:.15vh solid rgba(245,196,81,.5);font-size:1.8vh;padding:1vh 2vh}
.gbox .err{color:#ff8a8a;min-height:2.4vh}
.gbox .ok{color:#7dffb0}
</style>
</head>
<body>
<div id="sky"></div>
<div class="layer" id="skyDraw"></div>
<div class="layer" id="skyGame"></div>
<div class="layer" id="rays"><i></i></div>
<div class="layer" id="speed"></div>
<div class="layer" id="clouds">
  <svg class="l" viewBox="0 0 600 220"><g fill="none" stroke="#f5c451" stroke-width="7" stroke-linecap="round"><path d="M20 200 C40 140 110 130 140 165 C150 110 230 95 260 150 C280 90 380 80 400 150 C430 110 520 120 540 175 C565 160 590 175 595 200"/><path d="M150 168 C170 150 200 152 210 172 M300 150 C320 128 360 132 368 160 M430 160 C450 145 480 150 486 175"/><path d="M60 205 C80 185 110 188 118 205"/></g><path d="M20 200 C40 140 110 130 140 165 C150 110 230 95 260 150 C280 90 380 80 400 150 C430 110 520 120 540 175 C565 160 590 175 595 200 Z" fill="rgba(245,196,81,.12)"/></svg>

<script type="module">
import { createBus } from './bus.js';
'use strict';
const C = window.WEIYA || {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ===== 流程 =====
const STAGES = (C.stages && C.stages.length) ? C.stages : [{ t: '', ic: '🏮', h: '尾牙', ml: '', d: '', chip: '尾牙' }];
const GAMES = C.games || {};

document.body.classList.toggle('noFlow', C.showFlow === false);
document.body.classList.toggle('noTime', C.showTime === false);
const LAST = STAGES.length - 1, PRE = 0.9;
// 頭獎那一段（頭獎後面還可以有加碼、散場）
const GI = (() => { const i = STAGES.findIndex(s => s.grand); return i < 0 ? LAST : i; })();
// 三種氛圍：dine 用餐、draw 抽獎、game 遊戲（stage 可以用 mood 指定）
const moodOf = s => s.mood || ((s.game || s.rules) ? 'game' : (s.draw || s.grand) ? 'draw' : 'dine');
const MOOD_TAG = { dine: '🍽 用餐時間', draw: '🎁 抽獎時間', game: '🎮 遊戲時間' };

const MOOD_MUSIC = { dine: 'dine', draw: 'draw', game: 'truefalse' };
const musicOf = s => s.music || MOOD_MUSIC[moodOf(s)];
let MOOD = 'dine';
let idx = 0, p = 0, target = 0, charging = false, exploded = false;
let inGame = false; const opened = new Set();

$('flow').innerHTML = STAGES.map(s => `<div class="${s.grand ? 'grand' : ''}">${esc(s.chip)}<small>${esc(s.t)}</small></div>`).join('');
$('ticks').innerHTML = STAGES.slice(1, GI).map((s, i) => `<i style="left:${stageP(i + 1) * 100}%"></i>`).join('');
function stageP(i) { return i > GI ? 1 : i === GI ? PRE : i / GI * PRE; }

function render() {
  const s = STAGES[idx];
  [...$('flow').children].forEach((c, i) => c.className = (STAGES[i].grand ? 'grand ' : '') + (i < idx ? 'done' : i === idx ? 'now' : ''));
  const rules = Array.isArray(s.rules) && s.rules.length ? `<ol class="rules">${s.rules.map(r => typeof r === 'string' ? `<li>${esc(r)}</li>` : `<li>${esc(r.zh)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</li>`).join('')}</ol>` : '';
  const tag = s.game ? `<div class="tag">${esc(s.tag || '📱 掃大螢幕 QR Code 加入')}</div>` : '';
  $('main').innerHTML = `<div class="card${rules ? ' hasRules' : ''}"><div class="time">${esc(s.t)}</div><span class="icon">${esc(s.ic)}</span><h1>${esc(s.h)}</h1><div class="ml">${esc(s.ml)}</div><div class="desc">${esc(s.d)}</div>${rules}${tag}</div>`;
  document.body.classList.toggle('rulesOn', !!rules);
  MOOD = moodOf(s);
  for (const m of ['dine', 'draw', 'game']) document.body.classList.toggle('mood-' + m, m === MOOD);
  const mt = s.moodTag !== undefined ? s.moodTag : MOOD_TAG[MOOD];
  $('moodTag').textContent = mt || ''; $('moodTag').style.display = mt ? '' : 'none';
  target = stageP(idx);
  $('hintline').textContent = s.grand ? (exploded ? '' : '按 → 開始集氣衝刺！') : (idx < GI ? `再 ${GI - idx} 段就開頭獎` : '');
  dirty();
}
function arrive() { const s = STAGES[idx]; if (s.draw) FX.burstShow(4); else if (s.grand) FX.burstShow(3); else FX.burstShow(1); AU.scene(s); }
let cine = 0, cineT = [];
function hideGrand() { $('grand').classList.remove('on'); document.body.classList.remove('big'); $('main').style.visibility = ''; }
function next() {
  AU.unlock();
  if (inGame) { closeGame(); return; }
  if (cine === 1) { endCine(); return; } if (cine === 2) return;
  if (charging) return;
  const s = STAGES[idx];
  if (s.game && GAMES[s.game] && !opened.has(idx)) { openGame(); return; }
  if (s.grand && !exploded) { startCharge(); return; }
  if (s.grand && $('grand').classList.contains('on')) { hideGrand(); dirty(); return; }
  if (idx < LAST) { if (STAGES[idx + 1].video) startCine(); else { idx++; render(); arrive(); } }
}
function prev() {
  AU.unlock();
  if (inGame) { closeGame(); return; }
  if (cine === 1) { endCine(); return; } if (cine === 2) return;
  if (charging) return;
  if ($('grand').classList.contains('on')) { hideGrand(); exploded = false; p = PRE; render(); AU.scene(STAGES[idx]); return; }
  if (idx > 0) { idx--; if (idx <= GI) exploded = false; opened.delete(idx); render(); AU.scene(STAGES[idx]); }
}
function goto(i) {
  i = Math.max(0, Math.min(LAST, i | 0));
  if (charging) return;
  if (cine) { cineT.forEach(clearTimeout); cineT = []; cine = 0; $('cine').classList.remove('on'); $('vid').classList.remove('on'); $('cinePh').classList.remove('on'); try { $('vid').pause(); } catch (e) {} }
  if (inGame) closeGame();
  hideGrand(); exploded = i > GI; opened.delete(i);
  idx = i; render(); arrive();
}
function startCine() {
  cine = 1; AU.fade(1.6); const v = $('vid'); $('cineHint').textContent = ''; $('cine').classList.add('on'); dirty();
  cineT.push(setTimeout(() => {
    idx++; render();
    if (v.dataset.ready) { try { v.currentTime = 0; } catch (e) {} v.classList.add('on'); const pr = v.play(); if (pr && pr.catch) pr.catch(() => { $('cineHint').textContent = '按一下畫面開始播放'; }); }
    else { $('cinePh').classList.add('on'); cineT.push(setTimeout(endCine, 4500)); }
  }, 2300));
}
function endCine() {
  if (cine !== 1) return; cine = 2; cineT.forEach(clearTimeout); cineT = [];
  const v = $('vid'); v.classList.remove('on'); $('cinePh').classList.remove('on');
  if (!STAGES[idx].video) { idx++; render(); }
  setTimeout(() => { try { v.pause(); } catch (e) {} $('cine').classList.remove('on'); arrive(); setTimeout(() => { cine = 0; dirty(); }, 1300); }, 900);
}
function startCharge() {
  charging = true; document.body.classList.add('charging'); dirty(); $('hintline').textContent = '🔥 能量灌注中… 🔥'; AU.fade(.8); AU.riser(9);
  const from = p, dur = 9000, t0 = performance.now();

    const k = Math.min(1, (t - t0) / dur);
    const e = k < .85 ? from + (.985 - from) * Math.pow(k / .85, 1.8) : .985 + (1 - .985) * ((k - .85) / .15);
    p = target = Math.min(1, e);
    const heat = Math.pow(k, 2.2);
    document.body.style.setProperty('--sh', (heat * 9).toFixed(1));
    document.body.classList.toggle('shake', heat > .08);
    $('sky').style.filter = `brightness(${1 + heat * .6 * Math.abs(Math.sin(t / (260 - heat * 180)))})`;
    FX.sparkAtBar(1 + Math.floor(heat * 10));
    if (k < 1) requestAnimationFrame(step); else countdown();
  })(t0);
}
function countdown() {
  let n = 3; const c = $('count');
  const tick = () => {
    if (n === 0) { c.innerHTML = ''; explode(); return; }
    c.innerHTML = `<span>${n}</span>`; document.body.style.setProperty('--sh', 6); document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 250); FX.burst(innerWidth / 2, innerHeight / 2, 40 + (3 - n) * 40); n--; setTimeout(tick, 900);
  };
  tick();
}
function explode() {
  document.body.classList.remove('shake', 'charging'); $('sky').style.filter = ''; AU.boom();
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  FX.shock(); FX.grandShow();
  document.body.classList.add('big'); $('main').style.visibility = 'hidden'; setTimeout(() => $('grand').classList.add('on'), 250);
  exploded = true; charging = false; $('hintline').textContent = ''; dirty();
}
function loop() {
  p += (target - p) * (charging ? 1 : .04);
  $('fill').style.width = (p * 100).toFixed(2) + '%';
  $('pct').textContent = Math.floor(p * 100 + .0001) + '%';
  if (charging) $('cpct').textContent = Math.floor(p * 100 + .0001) + '%';
  document.documentElement.style.setProperty('--p', p.toFixed(3));
  const r = $('fill').parentElement.getBoundingClientRect(); const g = $('goal');
  g.style.left = r.right + 'px'; g.style.top = (r.top + r.height / 2) + 'px';
  requestAnimationFrame(loop);
}

// ===== 粒子特效 =====
const FX = (function () {
  const amb = $('amb'), fx = $('fx'), A = amb.getContext('2d'), X = fx.getContext('2d');
  let W, H, dpr; const PA = [], PX = [], spr = {};
  function size() { dpr = Math.min(1.5, devicePixelRatio || 1); W = innerWidth; H = innerHeight; for (const c of [amb, fx]) { c.width = W * dpr; c.height = H * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); } }
  size(); addEventListener('resize', size);
  const R = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const COL = ['#ffd23f', '#ff3b3b', '#ffffff', '#ff9500', '#ff7ad9', '#3bc7ff', '#fff1a8'];
  function sprite(ch, s) { s = Math.max(8, Math.round(s / 6) * 6); const k = ch + s; if (spr[k]) return spr[k]; const c = document.createElement('canvas'), n = Math.ceil(s * 1.4); c.width = c.height = n; const x = c.getContext('2d'); x.font = `${s}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, n / 2, n / 2 + s * .06); return spr[k] = c; }
  const add = (L, o) => { if (L.length < 2200) L.push(Object.assign({ age: 0, delay: 0, vx: 0, vy: 0, rot: 0, vr: 0, g: 0, drag: 0, sway: 0, ph: R(0, 6) }, o)); };
  function burst(x, y, n, cols) { const c = cols || [pick(COL), pick(COL)]; for (let i = 0; i < n; i++) { const a = R(0, 6.283), v = R(120, 560) * (H / 900); add(PX, { k: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 170, drag: 1.1, life: R(1.1, 2), s: R(2, 5), c: pick(c) }); } add(PX, { k: 'flash', x, y, life: .4, s: H * .13 }); }
  function firework() { const x = R(.1, .9) * W, y = R(.12, .5) * H; add(PX, { k: 'rise', x, y: H + 10, tx: x, ty: y, vy: -R(900, 1200) * (H / 900), life: 3, s: 3, c: '#fff1a8', onDone: () => burst(x, y, R(80, 130)) }); }
  function burstShow(lv) { for (let i = 0; i < lv * 2; i++) setTimeout(firework, i * 300); if (lv >= 3) coins(60 * lv); }
  function coins(n) { for (let i = 0; i < n; i++) add(PX, { k: 'coin', x: R(0, W), y: -R(20, H), vx: R(-30, 30), vy: R(260, 520) * (H / 900), g: 140, life: 5, s: R(.022, .042) * H, spin: R(4, 10) }); }
  // 集氣時從中間能量圈的邊緣往外噴火花
  function sparkAtBar(n) { const b = $('charge').getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2, rr = b.width / 2; for (let i = 0; i < n; i++) { const a = R(0, 6.283); const v = R(150, 520) * (H / 900); add(PX, { k: 'dot', x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 300, drag: .6, life: R(.5, 1.1), s: R(1.5, 4), c: pick(['#ffd23f', '#fff1a8', '#ff9500', '#fff']) }); } }
  function shock() { add(PX, { k: 'ring', x: W / 2, y: H / 2, life: 1.2, s: 0 }); add(PX, { k: 'ring', x: W / 2, y: H / 2, life: 1.6, s: 0, delay: .15 });
    for (let i = 0; i < 500; i++) { const a = R(0, 6.283), v = R(300, 1500) * (H / 900); add(PX, { k: 'dot', x: W / 2, y: H / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 220, drag: 1.4, life: R(1.4, 2.8), s: R(2, 6), c: pick(COL) }); } }
  function confetti(n) { for (let i = 0; i < n; i++) add(PX, { k: 'rect', x: R(0, W), y: -R(10, H * .8), vx: R(-60, 60), vy: R(160, 360) * (H / 900), g: 30, life: 6, s: R(.008, .016) * H, c: pick(COL), rot: R(0, 6), vr: R(-8, 8), sway: R(20, 60) }); }
  function grandShow() { coins(260); confetti(320); for (let i = 0; i < 16; i++) setTimeout(firework, 300 + i * 380);
    for (let i = 0; i < 60; i++) add(PX, { k: 'img', ch: '🧧', x: R(0, W), y: -R(40, H * 1.2), vx: R(-20, 20), vy: R(220, 420) * (H / 900), life: 6, s: R(.05, .09) * H, rot: R(-.4, .4), vr: R(-1, 1), sway: R(30, 80) });

  let acc = 0;

    // 用餐：零星金光和小燈籠慢慢飄；抽獎：金幣、紅包雨；遊戲：火花快速往上竄

        else add(PA, { k: 'img', ch: pick(['⭐', '✨', '🎯']), x: R(0, W), y: H + 30, vx: R(-20, 20), vy: -R(160, 300) * (H / 900), life: 6, s: R(.025, .04) * H, rot: 0, vr: R(-2, 2) });
        continue;

        else if (r < .8) add(PA, { k: 'img', ch: pick(['🏮', '🍊', '🌸']), x: R(0, W), y: -40, vx: 0, vy: R(35, 70) * (H / 900), life: 22, s: R(.025, .04) * H, rot: R(-.2, .2), vr: R(-.3, .3), sway: R(15, 35) });
        else add(PA, { k: 'coin', x: R(0, W), y: -30, vx: R(-10, 10), vy: R(60, 110) * (H / 900), life: 16, s: R(.012, .02) * H, spin: R(2, 4) });
        continue;
      }
      if (r < .45) add(PA, { k: 'coin', x: R(0, W), y: -30, vx: R(-15, 15), vy: R(90, 200) * (H / 900), life: 12, s: R(.014, .026) * H, spin: R(3, 7) });
      else if (r < .65) add(PA, { k: 'img', ch: pick(['🧧', '🧧', '🍊', '✨']), x: R(0, W), y: -40, vx: 0, vy: R(70, 150) * (H / 900), life: 14, s: R(.028, .045) * H, rot: R(-.3, .3), vr: R(-.6, .6), sway: R(20, 50) });
      else add(PA, { k: 'glow', x: R(0, W), y: H + 10, vx: R(-10, 10), vy: -R(30, 90) * (H / 900), life: R(5, 10), s: R(1, 3), c: pick(['#ffd23f', '#ff9a3c', '#fff1a8']) });
    }
  }
  function draw(C2, L, dt) {
    C2.clearRect(0, 0, W, H);
    for (let i = L.length - 1; i >= 0; i--) { const q = L[i];
      if (q.delay > 0) { q.delay -= dt; continue; }

      if (q.k === 'dot' || q.k === 'glow') { C2.fillStyle = q.c; if (q.k === 'glow') { C2.shadowColor = q.c; C2.shadowBlur = 10; } C2.beginPath(); C2.arc(q.x, q.y, q.s, 0, 6.283); C2.fill(); C2.shadowBlur = 0; }
      else if (q.k === 'flash') { const g = C2.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.s); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)'); C2.fillStyle = g; C2.globalAlpha = 1 - q.age / q.life; C2.beginPath(); C2.arc(q.x, q.y, q.s, 0, 6.283); C2.fill(); }
      else if (q.k === 'ring') { const k = q.age / q.life, rad = k * Math.hypot(W, H) * .7; C2.globalAlpha = 1 - k; C2.strokeStyle = '#ffe7a0'; C2.lineWidth = H * .03 * (1 - k) + 2; C2.beginPath(); C2.arc(q.x, q.y, rad, 0, 6.283); C2.stroke(); }
      else if (q.k === 'rect') { C2.save(); C2.translate(q.x, q.y); C2.rotate(q.rot); C2.fillStyle = q.c; C2.fillRect(-q.s, -q.s * .45, q.s * 2, q.s * .9); C2.restore(); }
      else if (q.k === 'coin') { const sx = Math.abs(Math.cos(q.age * q.spin)) + .08; C2.save(); C2.translate(q.x, q.y); C2.scale(sx, 1); C2.fillStyle = '#a8740b'; C2.beginPath(); C2.arc(0, 0, q.s, 0, 6.283); C2.fill(); C2.fillStyle = '#ffd23f'; C2.beginPath(); C2.arc(0, 0, q.s * .82, 0, 6.283); C2.fill(); C2.strokeStyle = '#a8740b'; C2.lineWidth = q.s * .12; C2.strokeRect(-q.s * .28, -q.s * .28, q.s * .56, q.s * .56); C2.restore(); }
      else if (q.k === 'img') { const s = sprite(q.ch, q.s); C2.save(); C2.translate(q.x, q.y); C2.rotate(q.rot); C2.drawImage(s, -s.width / 2, -s.height / 2); C2.restore(); }
    }
    C2.globalAlpha = 1;
  }
  let last = performance.now();
  (function frame(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (!inGame) { ambient(dt); draw(A, PA, dt); draw(X, PX, dt); } requestAnimationFrame(frame); })(last);
  return { burst, burstShow, sparkAtBar, shock, grandShow, firework };
})();

// ===== 音樂（原創合成）＋ 音量 =====
let VOL = 80; try { const v = +localStorage.getItem('weiyaVol'); if (v >= 0 && v <= 100 && localStorage.getItem('weiyaVol') !== null) VOL = v; } catch (e) {}
// 喜慶過年風：鑼鼓、嗩吶、鞭炮（festive.js，原創即時合成）
const AU = (function () {
  const FA = window.FestiveAudio;
  let unlocked = false, on = true, cur = 'party', userGame = null, elT;
  function unlock() {
    if (!FA) return;
    FA.init(); FA.setVolume(VOL / 100);
    if (!unlocked) { unlocked = true; apply(cur, 1.5); }
  }
  function fadeEl(target, d) { clearInterval(elT); const a = userGame, st = a.volume, t0 = performance.now(); target *= VOL / 100; if (target > 0 && a.paused) { const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); }
    elT = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / (d * 1000)); a.volume = Math.max(0, Math.min(1, st + (target - st) * k)); if (k >= 1) { clearInterval(elT); if (target === 0) a.pause(); } }, 50); }
  function apply(k, d) { cur = k; if (!FA || !unlocked) return; const file = !!userGame && k === 'game';
    FA.music(on && !file && k && k !== 'none' ? k : null, d); if (userGame) fadeEl(on && file ? 1 : 0, d); }
  function riser(d) { if (FA && unlocked && on) FA.riser(d); }
  function boom() { if (FA && unlocked && on) FA.boom(); setTimeout(() => apply(musicOf(STAGES[idx]), 2), 3500); }
  return { unlock, scene: s => apply(musicOf(s), 1.2), fade: d => apply('none', d), riser, boom,
    isOn: () => on, ready: () => !!FA && FA.ready(),
    toggle() { on = !on; apply(cur, .3); return on; },
    volume() { if (FA) FA.setVolume(VOL / 100); if (userGame && !userGame.paused) userGame.volume = Math.min(1, VOL / 100); },
    setGameFile(f) { if (userGame) { try { userGame.pause(); } catch (e) {} } userGame = new Audio(URL.createObjectURL(f)); userGame.loop = true; userGame.volume = 0; apply(cur, .5); } };
})();
// 影片本身比網頁音樂大聲很多：影片音量＝總音量 × videoVolume（config.js 可調，預設 0.4）
const VID_K = Math.max(0, Math.min(1, C.videoVolume == null ? 0.4 : +C.videoVolume));
const vidVol = () => Math.min(1, VOL / 100 * VID_K);
function setVol(v) {
  VOL = Math.max(0, Math.min(100, Math.round(+v || 0)));
  try { localStorage.setItem('weiyaVol', VOL); } catch (e) {}
  AU.volume(); $('vid').volume = vidVol();
  for (const k in frames) { try { frames[k].contentDocument.querySelectorAll('audio,video').forEach(m => m.volume = VOL / 100); const fa = frames[k].contentWindow.FestiveAudio; if (fa) fa.setVolume(VOL / 100); } catch (e) {} }
  dirty();
}
function setMusic() { $('bMus').textContent = AU.isOn() ? '🎵 音樂' : '🔇 靜音'; dirty(); }

$('vid').addEventListener('ended', () => endCine());
$('vid').addEventListener('error', () => { const v = $('vid'); if (v.dataset.ready && !v.dataset.local) { delete v.dataset.ready; $('bVid').textContent = '🎬 選影片（影片檔讀不到）'; } });
$('cine').addEventListener('click', () => { const v = $('vid'); if (v.dataset.ready && v.paused) { $('cineHint').textContent = ''; const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } });
$('bMus').onclick = () => { AU.unlock(); AU.toggle(); setMusic(); };
$('bVid').onclick = () => $('fVid').click();
$('fVid').onchange = e => { const f = e.target.files[0]; if (!f) return; const v = $('vid'); v.src = URL.createObjectURL(f); v.dataset.ready = '1'; v.dataset.local = '1'; $('bVid').textContent = '🎬 影片已載入'; };
if (C.introVideo) { const v = $('vid'); v.src = C.introVideo; v.dataset.ready = '1'; }
$('vid').volume = vidVol();
$('vid').addEventListener('play', () => { $('vid').volume = vidVol(); });
$('bGm').onclick = () => { AU.unlock(); $('fGm').click(); };
$('fGm').onchange = e => { const f = e.target.files[0]; if (!f) return; AU.setGameFile(f); $('bGm').textContent = '🎼 遊戲音樂已載入'; };

// ===== 遊戲層 =====
const frames = {};
// 各遊戲的按鈕：依大螢幕上的按鈕文字找到並按下；找不到時改送快捷鍵
const GBTN = {
  coins: {
    start: { re: /開始/, key: 's' },
    result: { re: /結算|關閉/, key: 'd' },
    reset: { re: /重置/, key: 'r', hold: 1 }
  },
  truefalse: {
    score: { re: /積分模式/ },
    elim: { re: /淘汰模式/ },
    start: { re: /開始遊戲/, key: 's' },
    reveal: { re: /公布結果/, key: 'p', hold: 1 },
    next: { re: /下一題|排行榜|頒獎/, key: 'n' },
    skip: { re: /跳過/, key: 'k', hold: 1 },
    restart: { re: /重新開始/, key: 'r', hold: 1 }
  }
};
function loadGames() {
  for (const k in GAMES) {
    if (frames[k]) continue;
    const f = document.createElement('iframe');
    f.src = GAMES[k].url; f.allow = 'fullscreen; autoplay; clipboard-write'; f.title = GAMES[k].name;
    f.addEventListener('load', () => hookFrame(f));
    $('gameLayer').appendChild(f); frames[k] = f;
  }
}
function hookFrame(f) {
  try {
    // 在遊戲畫面裡也能用：G 回流程（簡報筆的 PageDown/PageUp 在遊戲中不作用，避免誤觸離開）
    f.contentWindow.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase();
      if (k === 'g' && !/input|textarea|select/i.test((e.target && e.target.tagName) || '')) { e.preventDefault(); closeGame(); }
      if (k === 'pagedown' || k === 'pageup') e.preventDefault();
    }, true);
    f.contentDocument.querySelectorAll('audio,video').forEach(m => m.volume = VOL / 100);
    const fa = f.contentWindow.FestiveAudio; if (fa) fa.setVolume(VOL / 100);
  } catch (e) {}
}
function openGame() {
  const s = STAGES[idx]; if (!s.game || !frames[s.game]) return;
  inGame = true; opened.add(idx);
  for (const k in frames) frames[k].classList.toggle('cur', k === s.game);
  $('gameLayer').classList.add('on');
  setTimeout(() => { try { frames[s.game].focus(); frames[s.game].contentWindow.focus(); } catch (e) {} }, 100);
  dirty();
}
function closeGame() {
  if (!inGame) return;
  inGame = false; $('gameLayer').classList.remove('on');
  try { window.focus(); document.body.focus(); } catch (e) {}
  dirty();
}
$('gExit').onclick = closeGame;
const visible = el => { if (!el.getClientRects().length) return false; const cs = el.ownerDocument.defaultView.getComputedStyle(el); return cs.display !== 'none' && cs.visibility !== 'hidden' && +cs.opacity > 0.05; };
const btnText = b => (b.textContent || '').replace(/\s*\([A-Z]\)\s*$/, '').replace(/\s+/g, ' ').trim();
function findBtn(doc, re) {
  const list = [...doc.querySelectorAll('button,[role=button]')].filter(b => re.test(b.textContent || ''));
  return list.find(b => visible(b) && !b.disabled) || list.find(b => visible(b)) || list[0] || null;
}
function gameAction(name) {
  const s = STAGES[idx], k = s.game, f = frames[k], def = GBTN[k] && GBTN[k][name];
  if (!f || !def) return 'none';
  let doc, win; try { doc = f.contentDocument; win = f.contentWindow; } catch (e) { return 'blocked'; }
  if (!doc) return 'none';
  let b;
  if (k === 'coins' && name === 'result') { b = [...doc.querySelectorAll('button')].find(x => /關閉/.test(x.textContent) && visible(x)) || findBtn(doc, /結算/); }
  else b = findBtn(doc, def.re);
  if (b) { if (b.disabled) return 'disabled'; b.click(); return 'ok'; }
  if (def.key) {
    const K = def.key.toUpperCase();
    const ev = new win.KeyboardEvent('keydown', { key: def.key, code: 'Key' + K, keyCode: K.charCodeAt(0), which: K.charCodeAt(0), bubbles: true, cancelable: true });
    (doc.body || doc.documentElement).dispatchEvent(ev);
    return 'key';
  }
  return 'none';
}
function reloadGame() { const f = frames[STAGES[idx].game]; if (f) { try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } } }

// 讀「真的還假的」題庫，給遙控器當主持小抄
let QS = [];
const norm = s => String(s || '').replace(/\s+/g, '');
const unesc = s => { try { return JSON.parse('"' + s + '"'); } catch (e) { return s; } };
async function loadQs() {
  const g = GAMES.truefalse; if (!g || !g.questions) return;
  try {
    const t = await (await fetch(g.questions, { cache: 'no-store' })).text();
    const re = /ans\s*:\s*(true|false)\s*,\s*zh\s*:\s*"((?:[^"\\]|\\.)*)"([\s\S]*?)(?=ans\s*:|$)/g; let m;
    while ((m = re.exec(t))) { const ex = /ex\s*:\s*\{\s*zh\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(m[3]); const zh = unesc(m[2]); QS.push({ ans: m[1] === 'true', zh, n: norm(zh), ex: ex ? unesc(ex[1]) : '' }); }
  } catch (e) { console.warn('題庫讀取失敗', e); }
}
// 從遊戲畫面讀出人數、倒數、題目、按鈕可不可以按
function glance() {
  const k = STAGES[idx].game, f = frames[k]; if (!f) return null;
  let doc; try { doc = f.contentDocument; } catch (e) { return null; }
  if (!doc || !doc.body) return null;
  const g = { game: k, btn: {} };
  try {
    const txt = doc.body.innerText || '';
    let m;
    if ((m = /(\d+)\s*支手機/.exec(txt))) g.players = +m[1];
    else if ((m = /(\d+)\s*(?:人|位)(?!數)/.exec(txt))) g.players = +m[1];
    if ((m = /總\s*([\d,]+)\s*下/.exec(txt))) g.taps = m[1];
    if (k === 'truefalse' && (m = /(?:已作答|作答)[^\d]{0,8}(\d+)\s*\/\s*(\d+)/.exec(txt))) g.answered = m[1] + ' / ' + m[2];
    if (/DEMO/.test(txt)) g.demo = 1;
    if (/請先按下方主持人登入|請先登入/.test(txt)) g.needLogin = 1;
    // 畫面上字最大的數字 ≈ 倒數
    let best = null, bs = 44;
    for (const el of doc.body.querySelectorAll('*')) {
      if (el.childElementCount) continue;
      const t = (el.textContent || '').trim(); if (!/^\d{1,3}$/.test(t)) continue;
      const fs = parseFloat(doc.defaultView.getComputedStyle(el).fontSize) || 0;
      if (fs > bs && visible(el)) { bs = fs; best = t; }
    }
    if (best !== null) g.big = best;
    if (k === 'truefalse' && QS.length) {
      const nt = norm(txt); let q = null;
      for (const x of QS) if (x.n.length > 3 && nt.includes(x.n) && (!q || x.n.length > q.n.length)) q = x;
      if (q) { g.q = q.zh; g.ans = q.ans; g.ex = q.ex; }
    }
    for (const a in GBTN[k]) {
      let b;
      if (k === 'coins' && a === 'result') { const c = [...doc.querySelectorAll('button')].find(x => /關閉/.test(x.textContent) && visible(x)); b = c || findBtn(doc, /結算/); }
      else b = findBtn(doc, GBTN[k][a].re);
      g.btn[a] = b ? { ok: !b.disabled, label: btnText(b) } : { ok: true, label: '' };
    }
  } catch (e) {}
  return g;
}

// ===== 遙控 =====
let bus = null, lastBy = '', lastAct = '', ack = '', remotes = [];
let _dirty = true; function dirty() { _dirty = true; }
const ACT_NAME = { next: '下一段', prev: '上一段', goto: '跳段', fx: '煙火', music: '音樂', vol: '音量', game: '遊戲操作', openGame: '進入遊戲', exitGame: '離開遊戲', reloadGame: '重新載入遊戲', grand: '開頭獎', closeGrand: '收起頭獎' };
function exec(c) {
  lastBy = c.by || ''; lastAct = ACT_NAME[c.a] || c.a; let r = 'ok';
  switch (c.a) {
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'goto': goto(c.v); break;
    case 'fx': FX.burstShow(2); break;
    case 'music': AU.toggle(); setMusic(); break;
    case 'vol': setVol(c.v); break;
    case 'openGame': if (!inGame) openGame(); break;
    case 'exitGame': closeGame(); break;
    case 'reloadGame': reloadGame(); break;
    case 'grand': if (STAGES[idx].grand && !exploded && !charging && !inGame && !cine) startCharge(); break;
    case 'closeGrand': if (exploded) { hideGrand(); dirty(); } break;
    case 'game': r = gameAction(c.v); if (c.v) lastAct = (GAMES[STAGES[idx].game] || {}).name + '・' + c.v; setTimeout(dirty, 300); break;
    default: r = 'unknown';
  }
  ack = c.id + ':' + r; dirty();
}
let lastPub = '';
function publish() {
  if (!bus) return;
  const s = STAGES[idx];
  const st = {
    idx, n: STAGES.length,
    stages: STAGES.map(x => ({ h: x.h, chip: x.chip, t: x.t || '', game: x.game || '', grand: !!x.grand })),
    inGame, cine: !!cine, charging, exploded, grandOn: $('grand').classList.contains('on'),
    opened: opened.has(idx), music: AU.isOn(), audio: AU.ready(), vol: VOL,
    glance: s.game ? glance() : null, remotes,
    lastBy, lastAct, ack
  };
  const j = JSON.stringify(st);
  if (j === lastPub) return; lastPub = j; bus.publishState(st);
}
setInterval(() => { if (_dirty || STAGES[idx].game) { _dirty = false; publish(); } }, 400);

// ===== 鍵盤 =====
addEventListener('keydown', e => {
  if (!$('gate').classList.contains('off')) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === ' ' || k === 'pagedown' || k === 'enter') { e.preventDefault(); if (!inGame) next(); }
  else if (k === 'arrowleft' || k === 'pageup') { e.preventDefault(); if (!inGame) prev(); }
  else if (k === 'g') { if (inGame) closeGame(); else if (STAGES[idx].game) openGame(); }
  else if (k === 'f') full();
  else if (k === 'b') FX.burstShow(2);
  else if (k === 'm') $('bMus').click();
});
function full() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {} }
$('bNext').onclick = next; $('bPrev').onclick = prev; $('bFx').onclick = () => FX.burstShow(2); $('bFull').onclick = full;
$('main').addEventListener('click', next);

// ===== 開始畫面：登入 → 點一下開始 =====
function badge() {
  const b = $('rbadge');
  if (!bus) { b.className = ''; b.querySelector('span').textContent = '遙控器未啟用'; return; }
  b.className = remotes.length ? 'ok' : '';
  b.querySelector('span').textContent = (bus.demo ? '試玩・' : '') + (remotes.length ? '遙控器 ' + remotes.length + ' 支' : '遙控器待連線');
}
function gateStart(info) {
  $('gbox').innerHTML = `<h2>尾牙主持大螢幕</h2><p class="ok">${info}</p><button class="pri" id="gGo">▶ 點一下開始</button><p>會自動全螢幕並開啟音效（瀏覽器規定要先點一下）</p>${bus && !bus.demo ? '<button class="sec" id="gOut">登出換帳號</button>' : ''}`;
  $('gGo').onclick = () => { AU.unlock(); full(); $('gate').classList.add('off'); dirty(); };
  if ($('gOut')) $('gOut').onclick = () => bus.logout();
}
function gateLogin(msg) {
  $('gbox').innerHTML = `<h2>尾牙主持大螢幕</h2><p>用主持人帳號登入，手機遙控器和遊戲才能用</p>
    <input id="gE" type="email" autocomplete="username" value="${esc(C.hostEmail || '')}" placeholder="Email">
    <input id="gP" type="password" autocomplete="current-password" placeholder="密碼">
    <div class="err" id="gErr">${esc(msg || '')}</div>
    <button class="pri" id="gIn">登入</button><button class="sec" id="gSkip">不用遙控，直接開始</button>`;
  const go = async () => { $('gErr').textContent = '登入中…'; try { await bus.login($('gE').value, $('gP').value); } catch (e) { $('gErr').textContent = /invalid|wrong|user-not-found/.test(e.code || '') ? '帳號或密碼不對' : /unauthorized-domain/.test(e.code || '') ? '網域沒加進 Firebase 授權網域' : '登入失敗：' + (e.code || e.message); } };
  $('gIn').onclick = go; $('gP').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('gSkip').onclick = () => { bus = null; badge(); loadGames(); gateStart('沒有登入：手機遙控器不能用，請用鍵盤操作'); };
}
let started = false;
(async function boot() {
  render(); loop(); loadQs();
  try { bus = await createBus(C, 'screen'); } catch (e) { bus = null; }
  if (!bus) { loadGames(); gateStart('遙控器連線失敗，請用鍵盤操作'); badge(); return; }
  bus.onUser(u => {
    if (!u) { if (!started) gateLogin(bus.loadError ? 'Firebase 載入失敗，改用試玩模式' : ''); else { badge(); } return; }
    const allowed = bus.demo || !C.remotes || Object.keys(C.remotes).map(x => x.toLowerCase()).includes((u.email || '').toLowerCase());
    if (!started) {
      started = true;
      if (allowed) {
        bus.listenCmds(exec); bus.screenPresence(); bus.onRemotes(list => { remotes = list; badge(); dirty(); });
      }
      loadGames(); badge();
      gateStart(bus.demo ? '試玩模式：同一台電腦另開分頁打開 remote.html?demo 當遙控器' : `已登入 ${esc(u.email)} ✅` + (allowed ? '' : '<br>（這個帳號不在遙控名單，遙控器不能用）'));
    }
  });
})();
</script>
