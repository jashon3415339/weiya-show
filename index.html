<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浤議科技 2026 尾牙・主持大螢幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e9c46a;--gold2:#f8e7b0;--gold3:#b8862b;--ink:#0b0807;--p:0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;user-select:none}
/* 背景：深色為主，氛圍只微調色溫 */
.bg{position:fixed;inset:0;transition:opacity 1.4s ease;pointer-events:none}
#bgDine{background:radial-gradient(120% 90% at 50% 10%,#3a1810 0%,#160b08 55%,#070403 100%)}
#bgDraw{background:radial-gradient(120% 90% at 50% 30%,#4a0d10 0%,#1a0607 55%,#070303 100%);opacity:0}
#bgGame{background:radial-gradient(120% 100% at 50% 40%,#13223a 0%,#0a0f1c 55%,#040509 100%);opacity:0}
body.mood-draw #bgDraw,body.mood-game #bgGame{opacity:1}
#dim{position:fixed;inset:0;background:#000;opacity:0;transition:opacity 1.5s ease;pointer-events:none;z-index:6}
body.dark #dim{opacity:.85}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#amb{z-index:1}#fx{z-index:7}
#frame{position:fixed;inset:1.6vh;z-index:4;border:.25vh solid rgba(233,196,106,.45);border-radius:1.6vh;pointer-events:none}
#frame::before,#frame::after{content:"";position:absolute;width:7vh;height:7vh;border:.5vh solid var(--gold)}
#frame::before{left:-.6vh;top:-.6vh;border-right:0;border-bottom:0}
#frame::after{right:-.6vh;bottom:-.6vh;border-left:0;border-top:0}
#clouds{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.22}
#clouds svg{position:absolute;bottom:-2vh;width:40vw;height:auto;animation:drift 22s ease-in-out infinite alternate}
#clouds svg.l{left:-6vw}#clouds svg.r{right:-6vw;transform:scaleX(-1);animation-delay:-11s}
@keyframes drift{to{translate:3vw -1vh}}
.wrap{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:4vh 5vw 4vh}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2vw;transition:opacity .8s}
header .co{font:700 2.2vh "Noto Sans TC";letter-spacing:.3em;color:var(--gold2);opacity:.85}
header .ti{font:900 4.2vh "Noto Serif TC";color:var(--gold)}
header .meta{font-size:2vh;opacity:.7;text-align:right}
body.dark header,body.cinema header{opacity:.15}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(4vh)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
/* 一般卡片 */
.card{animation:rise .8s cubic-bezier(.2,1,.3,1) both}
.card .icon{display:inline-flex;align-items:center;justify-content:center;width:17vh;height:17vh;border-radius:50%;font-size:9.5vh;margin-bottom:2vh;border:.35vh solid var(--gold);box-shadow:0 0 0 1.2vh rgba(233,196,106,.08)}
.card h1{margin:0;font:900 13vh/1.12 "Noto Serif TC";color:var(--gold);background:linear-gradient(180deg,#fff3cf 10%,#e9c46a 60%,#b8862b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card .ml{font-size:3vh;opacity:.75;margin-top:1.6vh;letter-spacing:.06em}
.card .desc{font-size:4vh;margin-top:3vh;color:#fff;font-weight:700}
.card .tag{display:inline-block;margin-top:2.6vh;font-size:2.6vh;padding:.6vh 2.4vh;border:.2vh solid rgba(233,196,106,.6);border-radius:99px;color:var(--gold2)}
/* 抽獎 */
.draw{width:100%;animation:rise .7s both}
.draw .lab{font:900 4.2vh "Noto Sans TC";letter-spacing:.4em;color:var(--gold2);opacity:.9}
.draw h1{margin:1.2vh 0 0;font:900 14vh/1.05 "Noto Serif TC";background:linear-gradient(180deg,#fff3cf 10%,#e9c46a 60%,#b8862b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.draw .ml{font-size:2.8vh;opacity:.7;margin-top:1vh;letter-spacing:.08em}
.draw .by{margin-top:3.2vh;font:700 4vh "Noto Sans TC";color:#fff}
.draw .by b{font:900 7vh "Noto Sans TC";color:var(--gold);margin-left:1.6vh}
.draw .sub{margin-top:2.6vh;font:700 4vh "Noto Sans TC"}
.prizes{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;margin-top:4vh}
.prz{min-width:22vw;padding:2vh 2.6vw;border:.3vh solid rgba(233,196,106,.7);border-radius:1.6vh;background:rgba(0,0,0,.35)}
.prz .n{font:900 5vh "Noto Serif TC";color:var(--gold)}
.prz .a{font:900 6.4vh "Noto Sans TC";color:#fff;margin-top:.6vh;font-variant-numeric:tabular-nums}
.prz .c{font:700 3vh "Noto Sans TC";color:var(--gold2);margin-top:.4vh}
.status{margin-top:4vh;display:inline-block;font:900 3.4vh "Noto Sans TC";letter-spacing:.3em;padding:1vh 3.4vh;border-radius:99px;border:.25vh solid rgba(233,196,106,.6);color:var(--gold2)}
body.ph-drawing .status{color:#fff;border-color:#fff;animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.06);opacity:.75}}
/* 加碼：只有一個大問號，不透露內容 */
.bonusQ{font:900 30vh/1 "Noto Serif TC";color:var(--gold);animation:qbob 2.4s ease-in-out infinite;text-shadow:0 0 6vh rgba(233,196,106,.35)}
@keyframes qbob{50%{transform:translateY(-2vh) rotate(-6deg)}}
/* 揭曉瞬間 */
#win{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#win.on{animation:winA 3.2s ease forwards}
#win div{font:900 18vh "Noto Serif TC";background:linear-gradient(180deg,#fff 10%,#f8e7b0 45%,#e9c46a 75%,#b8862b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1vh 3vh rgba(0,0,0,.6))}
@keyframes winA{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
/* 麻將投影板 */
.board{width:100%;height:100%;display:flex;flex-direction:column;animation:rise .6s both}
.board .top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 1vw 2vh}
.board .top h1{margin:0;font:900 7vh "Noto Serif TC";color:var(--gold)}
.board .top h1 small{font:700 2.4vh "Noto Sans TC";color:var(--gold2);opacity:.8;margin-left:1.4vh;letter-spacing:.06em}
.board .cnt{font:900 4vh "Noto Sans TC";color:#fff}
.board .cnt b{font-size:7vh;color:var(--gold);font-variant-numeric:tabular-nums}
.board .body{flex:1;display:flex;gap:2vw;min-height:0;align-items:center}
.board .rows{flex:1;min-width:0;max-width:min(100%,108vh);display:flex;flex-direction:column;justify-content:center;gap:1.6vh}
.board .row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:min(.9vw,1.4vh)}
.tile{width:100%;aspect-ratio:3/4;border-radius:.9vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#221b17;border:.25vh solid #3a302a;color:#5d524a;transition:all .45s cubic-bezier(.2,1.4,.4,1);font-family:"Noto Serif TC",serif}
.tile .t1{font-size:4.2vh;font-weight:900;line-height:1}
.tile .t2{font-size:3.4vh;font-weight:900;line-height:1.1;margin-top:.4vh}
.tile.on{background:linear-gradient(180deg,#fff6dc,#f0d189);border-color:var(--gold);color:#2b1a08;box-shadow:0 .6vh 2vh rgba(233,196,106,.45);transform:translateY(-.6vh)}
.tile.on .t2.m{color:#b3141d}.tile.on .t2.p{color:#1d4fa3}.tile.on .t2.s{color:#17703a}
.tile.on.zr .t1{color:#b3141d}.tile.on.zg .t1{color:#17703a}.tile.on.zw .t1{color:#1d4fa3}
.tile.last{box-shadow:0 0 0 .5vh #fff,0 0 4vh rgba(255,240,190,.9)}
.board .side{flex:none;width:min(20vw,30vh);display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:.2vh solid rgba(233,196,106,.25)}
.board .side .k{font:700 3vh "Noto Sans TC";color:var(--gold2);letter-spacing:.2em;margin-bottom:2vh}
.board .side .tile{width:70%}
.board .side .tile .t1{font-size:9vh}.board .side .tile .t2{font-size:7vh}
/* 真的還假的 開場 */
.tfi{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tfi .tt{font:900 18vh/1 "Noto Serif TC";opacity:0;letter-spacing:.04em;background:linear-gradient(180deg,#fff 10%,#e6f0ff 45%,#9cc4ff 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:all 1s cubic-bezier(.2,1,.3,1)}
.tfi .tt .o{-webkit-text-fill-color:#4ade80}.tfi .tt .x{-webkit-text-fill-color:#f87171}
.tfi .tm{font:700 3vh "Noto Sans TC";letter-spacing:.5em;color:#cfe0ff;opacity:0;margin-top:2vh;transition:opacity 1s .4s}
.tfi.title .tt{opacity:1;animation:slam 1.1s cubic-bezier(.2,1.6,.35,1) both}
.tfi.title .tm{opacity:.85}
@keyframes slam{0%{opacity:0;transform:scale(2.6);filter:blur(2vh)}60%{opacity:1;transform:scale(.96);filter:blur(0)}100%{transform:scale(1)}}
.tfi.rules .tt{font-size:9vh;animation:none;opacity:1}
.tfi.rules .tm{display:none}
.tfi ol{list-style:none;margin:4vh 0 0;padding:0;counter-reset:r;text-align:left}
.tfi li{counter-increment:r;position:relative;padding:1.4vh 2.4vw 1.4vh 9vh;margin-bottom:1.6vh;border-radius:1.4vh;background:rgba(255,255,255,.05);border:.2vh solid rgba(156,196,255,.35);font:900 4.4vh/1.3 "Noto Sans TC";animation:rise .7s cubic-bezier(.2,1,.3,1) both}
.tfi li::before{content:counter(r);position:absolute;left:2vh;top:50%;transform:translateY(-50%);width:5.4vh;height:5.4vh;border-radius:50%;background:#9cc4ff;color:#0a0f1c;font:900 3.4vh/5.4vh "Noto Sans TC";text-align:center}
.tfi li small{display:block;font:400 2.2vh/1.4 "Noto Sans TC";color:#cfe0ff;opacity:.85;margin-top:.4vh}
.tfi .shapes{position:absolute;inset:-10vh;pointer-events:none;z-index:-1}
.tfi .shapes i{position:absolute;font-style:normal;font-weight:900;opacity:.07;animation:float 16s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(4vw,-5vh) rotate(25deg)}}
/* 頭獎 */
.grand{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grand .pre{font:900 4.6vh "Noto Sans TC";letter-spacing:.8em;color:var(--gold2);opacity:.85}
.grand .big{font:900 34vh/1 "Noto Serif TC";letter-spacing:.06em;background:linear-gradient(180deg,#fff 5%,#f8e7b0 40%,#e9c46a 70%,#a8741f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grand .ml{font:700 3vh "Noto Sans TC";letter-spacing:.5em;color:var(--gold2);opacity:.8;margin-top:1vh}
.grand .prize{margin-top:3.4vh;font:900 6vh "Noto Sans TC";color:#fff;padding:1.4vh 5vh;border-top:.3vh solid var(--gold);border-bottom:.3vh solid var(--gold)}
.grand.idle .big{font-size:20vh;opacity:.9}
.grand.idle .prize{display:none}
.grand.build .big,.grand.build .prize,.grand.build .ml,.grand.build .pre{opacity:0}
.grand.hit .big{animation:gIn 1.6s cubic-bezier(.2,1.5,.35,1) both}
.grand.hit .ml{animation:rise 1s .9s both}.grand.hit .prize{animation:rise 1s 1.3s both}.grand.hit .pre{animation:rise 1s .5s both}
@keyframes gIn{0%{opacity:0;transform:scale(.3);filter:blur(3vh)}55%{opacity:1;transform:scale(1.08);filter:blur(0)}100%{transform:scale(1)}}
.grand .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:300% 100%;-webkit-mask:linear-gradient(#000,#000);opacity:0}
.grand.rest .big{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 4vh rgba(233,196,106,.55))}}
#beams{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity 1.5s}
#beams i{position:absolute;bottom:-10vh;width:22vw;height:140vh;transform-origin:50% 100%;background:linear-gradient(0deg,rgba(255,236,180,.0),rgba(255,236,180,.22) 40%,rgba(255,236,180,0));clip-path:polygon(40% 100%,60% 100%,100% 0,0 0);filter:blur(.6vh)}
#beams i:nth-child(1){left:8vw;animation:sweepL 6s ease-in-out infinite alternate}
#beams i:nth-child(2){right:8vw;animation:sweepR 6s ease-in-out infinite alternate}
#beams i:nth-child(3){left:39vw;animation:sweepC 5s ease-in-out infinite alternate;opacity:.7}
@keyframes sweepL{from{transform:rotate(-25deg)}to{transform:rotate(18deg)}}
@keyframes sweepR{from{transform:rotate(25deg)}to{transform:rotate(-18deg)}}
@keyframes sweepC{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
body.beams #beams{opacity:1}
/* 過場影片 */
#cine{position:fixed;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s ease;display:flex;align-items:center;justify-content:center}
#cine.on{opacity:1;pointer-events:auto}
#vid{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 2s ease}
#vid.on{opacity:1}
#cinePh{position:absolute;opacity:0;transition:opacity 2s;text-align:center;font-size:4vh;line-height:1.8;color:var(--gold2)}#cinePh.on{opacity:1}
#cinePh small{font-size:2.2vh;opacity:.7}
#cineHint{position:absolute;bottom:4vh;font-size:2vh;opacity:.6}
/* 遊戲層 */
#gameLayer{position:fixed;inset:0;z-index:30;background:#000;visibility:hidden;opacity:0;transition:opacity .6s,visibility 0s .6s;pointer-events:none}
#gameLayer.on{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .6s}
#gameLayer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;background:#000}
#gameLayer.on iframe.cur{visibility:visible}
#gExit{position:absolute;left:1vh;top:1vh;z-index:2;font:700 1.6vh "Noto Sans TC";padding:.7vh 1.3vh;border-radius:1vh;border:.15vh solid var(--gold);background:rgba(0,0,0,.6);color:var(--gold2);cursor:pointer;opacity:0;transition:opacity .3s}
#gExit:hover{opacity:1}
/* 主持工具（滑鼠移到右下角才出現） */
#help{position:fixed;left:50%;bottom:.4vh;transform:translateX(-50%);z-index:10;font-size:1.4vh;opacity:.25;white-space:nowrap}
#tools{position:fixed;right:1vh;bottom:1vh;z-index:11;display:flex;gap:.6vh;opacity:.08;transition:opacity .3s;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
#tools:hover{opacity:1}
#tools button{font:700 1.6vh "Noto Sans TC";padding:.8vh 1.4vh;border-radius:1vh;border:.15vh solid var(--gold);background:rgba(0,0,0,.7);color:var(--gold2);cursor:pointer}
#rbadge{position:fixed;left:2.4vh;bottom:2.4vh;z-index:4;font-size:1.5vh;padding:.4vh 1.2vh;border-radius:99px;background:rgba(0,0,0,.35);border:.15vh solid rgba(233,196,106,.25);color:var(--gold2);opacity:.45}
#rbadge i{display:inline-block;width:1vh;height:1vh;border-radius:50%;background:#888;margin-right:.7vh;vertical-align:.05vh}
#rbadge.ok i{background:#3ddc84}
#talkBadge{position:fixed;right:2.4vh;top:2.4vh;z-index:9;font:700 1.6vh "Noto Sans TC";padding:.4vh 1.2vh;border-radius:99px;background:rgba(0,0,0,.4);color:var(--gold2);opacity:0;transition:opacity .3s}
body.talk #talkBadge{opacity:.6}
/* 開始畫面 */
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2a120c,#070403 75%)}
#gate.off{display:none}
.gbox{width:min(92vw,560px);text-align:center;padding:4vh 4vh 3vh;border-radius:2.4vh;background:rgba(0,0,0,.45);border:.2vh solid rgba(233,196,106,.5)}
.gbox h2{margin:0 0 .6vh;font:900 4.4vh "Noto Serif TC";color:var(--gold)}
.gbox p{margin:.8vh 0;font-size:2vh;opacity:.85;line-height:1.6}
.gbox input{display:block;width:100%;margin:1.2vh 0;padding:1.4vh 1.6vh;font:2.2vh "Noto Sans TC";border-radius:1.2vh;border:.15vh solid rgba(233,196,106,.5);background:rgba(0,0,0,.5);color:#fff}
.gbox button{font:900 2.4vh "Noto Sans TC";padding:1.5vh 3vh;border-radius:1.4vh;border:0;cursor:pointer;margin:1vh .5vh 0}
.gbox .pri{background:linear-gradient(var(--gold2),var(--gold));color:#3b1a05;width:100%;font-size:3vh;padding:2vh}
.gbox .sec{background:transparent;color:var(--gold2);border:.15vh solid rgba(233,196,106,.5);font-size:1.8vh;padding:1vh 2vh}
.gbox .err{color:#ff8a8a;min-height:2.4vh}
.gbox .ok{color:#7dffb0}
</style>
</head>

<div class="bg" id="bgDine"></div><div class="bg" id="bgDraw"></div><div class="bg" id="bgGame"></div>
<div id="clouds">
  <svg class="l" viewBox="0 0 600 220"><g fill="none" stroke="#e9c46a" stroke-width="6" stroke-linecap="round"><path d="M20 200 C40 140 110 130 140 165 C150 110 230 95 260 150 C280 90 380 80 400 150 C430 110 520 120 540 175 C565 160 590 175 595 200"/><path d="M150 168 C170 150 200 152 210 172 M300 150 C320 128 360 132 368 160 M430 160 C450 145 480 150 486 175"/></g></svg>
  <svg class="r" viewBox="0 0 600 220"><g fill="none" stroke="#e9c46a" stroke-width="6" stroke-linecap="round"><path d="M20 200 C40 140 110 130 140 165 C150 110 230 95 260 150 C280 90 380 80 400 150 C430 110 520 120 540 175 C565 160 590 175 595 200"/><path d="M150 168 C170 150 200 152 210 172 M300 150 C320 128 360 132 368 160 M430 160 C450 145 480 150 486 175"/></g></svg>
</div>

<div id="frame"></div>
<div class="wrap">
  <header>

  <main id="main"></main>
</div>
<div id="dim"></div>
<div id="beams"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<div id="win"><div id="winTxt">恭喜！</div></div>

<script type="module">
import { createBus } from './bus.js';
'use strict';
const C = window.WEIYA || {};
const FA = window.FestiveAudio;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n == null ? '' : 'NT$ ' + Number(n).toLocaleString('en-US');
if (C.meta) $('meta').innerHTML = C.meta;

// ================= 流程 =================
const STAGES = (C.stages && C.stages.length) ? C.stages : [{ h: '尾牙', ml: '', d: '' }];
const GAMES = C.games || {};
const LAST = STAGES.length - 1;
const typeOf = s => s.type || (s.game ? 'game' : 'card');
const moodOf = s => s.mood || ({ draw: 'draw', grand: 'draw', board: 'game', tfIntro: 'game', game: 'game' }[typeOf(s)] || 'dine');
const PRIZES = C.prizes || {};
let idx = 0, inGame = false, cine = 0, cineT = [];
const opened = new Set();
// 各段的狀態
let phase = 'ready';           // 抽獎：ready 準備／drawing 抽獎中／reveal 揭曉
let tfStep = 0;                // 真假開場：0 暗場、1 標題、2… 規則
let gphase = 'idle';           // 頭獎：idle／build／hit／rest／award
let talk = false;
let timers = [];
const later = (ms, f) => timers.push(setTimeout(f, ms));

// ================= 《Way Back Then》音檔播放器（存在這台電腦的瀏覽器） =================
const TRK = (function () {
  const a = new Audio(); a.preload = 'auto';
  let ok = false, base = 0, mode = 'idle', fadeT = null, tensionI = 0;
  const cfg = () => C.tfTrack || {};
  const eff = () => base * (VOL / 100) * (talk ? (C.talkVolume == null ? .12 : C.talkVolume) / Math.max(.05, base || 1) * Math.min(1, base || 1) : 1);
  function apply() { a.volume = Math.max(0, Math.min(1, base * (VOL / 100) * (talk ? Math.min(1, (C.talkVolume == null ? .12 : C.talkVolume) / Math.max(base, .01)) : 1))); }

    clearInterval(fadeT); const st = base, t0 = performance.now(), d = Math.max(.05, sec) * 1000;
    fadeT = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / d); base = st + (v - st) * k; apply(); if (k >= 1) { clearInterval(fadeT); done && done(); } }, 40);
  }
  a.addEventListener('timeupdate', () => { const c = cfg(); if (mode === 'loop' && a.currentTime > (c.loopTo || 66)) a.currentTime = c.loopFrom || 12; });
  a.addEventListener('ended', () => { if (mode === 'loop' || mode === 'board') { a.currentTime = cfg().loopFrom || 12; mode = 'loop'; a.play().catch(() => {}); } });
  async function load() {
    try { const f = await idbGet('tfTrack'); if (f) { a.src = URL.createObjectURL(f); ok = true; $('bTrk').textContent = '🎵 音檔已載入'; const g = $('gTrk'); if (g) g.textContent = '🎵 真的還假的音檔：已載入'; } } catch (e) {}
    // 這台電腦沒有手動載入過 → 用網站上的檔案（config.js 的 tfTrack.src）
    if (!ok && cfg().src) {
      a.src = cfg().src; ok = true; $('bTrk').textContent = '🎵 音檔已載入（網站）';
      const g = $('gTrk'); if (g) g.textContent = '🎵 真的還假的音檔：已載入';
      a.addEventListener('error', () => { ok = false; $('bTrk').textContent = '🎵 載入音檔（網站上的檔案讀不到）'; }, { once: true });
    }
  }
  return {
    get ok() { return ok; }, cfg, load, el: a,
    async setFile(f) { await idbSet('tfTrack', f); a.src = URL.createObjectURL(f); ok = true; $('bTrk').textContent = '🎵 音檔已載入'; dirty(); },
    playing: () => ok && !a.paused,
    play(from, vol, fadeSec, m) { if (!ok) return; mode = m || 'loop'; try { a.currentTime = from || 0; } catch (e) {} base = 0; apply(); a.play().catch(() => {}); fadeTo(vol, fadeSec || 1.5); },
    toLoop(vol, sec) { if (!ok) return; mode = 'loop'; if (a.paused) a.play().catch(() => {}); fadeTo(vol, sec || 1.5); },
    vol(v, sec) { if (!ok) return; fadeTo(v, sec || .5); },
    seek(t, vol, sec, m) { if (!ok) return; mode = m || mode; fadeTo(0, .15, () => { try { a.currentTime = t; } catch (e) {} if (a.paused) a.play().catch(() => {}); fadeTo(vol, sec || .3); }); },
    tension(vol) { const L = cfg().tension || [69]; const t = L[tensionI++ % L.length]; this.seek(t, vol, .3, 'tension'); },
    silence(sec) { if (!ok) return; fadeTo(0, .12, () => a.pause()); },
    resume(vol, sec) { if (!ok) return; a.play().catch(() => {}); fadeTo(vol, sec || .6); },
    stop(sec) { if (!ok || a.paused) return; mode = 'idle'; fadeTo(0, sec || 1, () => a.pause()); },
    refresh: apply

})();
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('weiya', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

  const GOLD = ['#f8e7b0', '#e9c46a', '#fff4d0', '#d9a441', '#ffffff'];
  const add = (L, o) => { if (L.length < 2000) L.push(Object.assign({ age: 0, delay: 0, vx: 0, vy: 0, rot: 0, vr: 0, g: 0, drag: 0, sway: 0, ph: R(0, 6) }, o)); };
  function burst(x, y, n, cols) { const c = cols || GOLD; for (let i = 0; i < n; i++) { const a = R(0, 6.283), v = R(120, 560) * (H / 900); add(PX, { k: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 170, drag: 1.1, life: R(1.1, 2), s: R(2, 4.5), c: pick(c) }); } }
  function firework() { const x = R(.12, .88) * W, y = R(.15, .45) * H; add(PX, { k: 'rise', x, y: H + 10, ty: y, vy: -R(900, 1200) * (H / 900), life: 3, s: 2.5, c: '#fff4d0', onDone: () => burst(x, y, R(70, 110)) }); }
  function burstShow(lv) { for (let i = 0; i < lv * 2; i++) setTimeout(firework, i * 280); }
  function confetti(n) { for (let i = 0; i < n; i++) add(PX, { k: 'rect', x: R(0, W), y: -R(10, H * .8), vx: R(-50, 50), vy: R(160, 340) * (H / 900), g: 30, life: 6, s: R(.008, .015) * H, c: pick(['#e9c46a', '#f8e7b0', '#ffffff', '#c0392b']), rot: R(0, 6), vr: R(-8, 8), sway: R(20, 60) }); }
  function grandShow() { confetti(300); for (let i = 0; i < 14; i++) setTimeout(firework, 200 + i * 300); }
  let acc = 0;
  function ambient(dt) {
    const m = document.body.classList.contains('mood-draw') ? 2.5 : document.body.classList.contains('mood-game') ? 2 : 1.2;
    acc += dt * m;
    while (acc > 1) { acc--; add(PA, { k: 'glow', x: R(0, W), y: H + 10, vx: R(-8, 8), vy: -R(20, 60) * (H / 900), life: R(8, 14), s: R(1.2, 2.8), c: pick(document.body.classList.contains('mood-game') ? ['#9cc4ff', '#e9c46a', '#ffffff'] : ['#e9c46a', '#f8e7b0', '#d9a441']) }); }
  }
  function draw(C2, L, dt) {
    C2.clearRect(0, 0, W, H);
    for (let i = L.length - 1; i >= 0; i--) { const q = L[i];
      if (q.delay > 0) { q.delay -= dt; continue; }
      q.age += dt;
      if (q.k === 'rise') { q.y += q.vy * dt; q.vy *= .985; if (q.y <= q.ty || q.age > q.life) { L.splice(i, 1); q.onDone && q.onDone(); continue; } C2.globalAlpha = 1; C2.fillStyle = q.c; C2.beginPath(); C2.arc(q.x, q.y, q.s, 0, 6.283); C2.fill(); continue; }
      if (q.age >= q.life || q.y > H + 120 || q.y < -H * 1.5) { L.splice(i, 1); continue; }
      q.vy += q.g * dt; if (q.drag) { q.vx -= q.vx * q.drag * dt; q.vy -= q.vy * q.drag * dt; }
      q.x += q.vx * dt + (q.sway ? Math.sin(q.age * 2 + q.ph) * q.sway * dt : 0); q.y += q.vy * dt; q.rot += q.vr * dt;
      C2.globalAlpha = Math.max(0, Math.min(1, (q.life - q.age) / .6)) * (q.k === 'glow' ? .6 : 1);
      if (q.k === 'dot' || q.k === 'glow') { C2.fillStyle = q.c; C2.beginPath(); C2.arc(q.x, q.y, q.s, 0, 6.283); C2.fill(); }
      else if (q.k === 'rect') { C2.save(); C2.translate(q.x, q.y); C2.rotate(q.rot); C2.fillStyle = q.c; C2.fillRect(-q.s, -q.s * .45, q.s * 2, q.s * .9); C2.restore(); }
    }
    C2.globalAlpha = 1;
  }
  let last = performance.now();
  (function frame(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (!inGame) { ambient(dt); draw(A, PA, dt); draw(X, PX, dt); } requestAnimationFrame(frame); })(last);
  return { burst, burstShow, grandShow };
})();

// ================= 音量 =================
let VOL = 80; try { const v = localStorage.getItem('weiyaVol'); if (v !== null && +v >= 0 && +v <= 100) VOL = +v; } catch (e) {}
let musicOn = true, unlocked = false;
function unlock() { if (!FA) return; FA.init(); FA.setVolume(musicOn ? VOL / 100 : 0); if (!unlocked) { unlocked = true; } }
const VID_K = Math.max(0, Math.min(1, C.videoVolume == null ? .4 : +C.videoVolume));
const vidVol = () => Math.min(1, VOL / 100 * VID_K);
function setVol(v) {
  VOL = Math.max(0, Math.min(100, Math.round(+v || 0)));
  try { localStorage.setItem('weiyaVol', VOL); } catch (e) {}
  if (FA) FA.setVolume(musicOn ? VOL / 100 : 0); TRK.refresh(); $('vid').volume = vidVol();
  for (const k in frames) { try { frames[k].contentDocument.querySelectorAll('audio,video').forEach(m => m.volume = VOL / 100); } catch (e) {} }
  dirty();
}
function toggleMusic() { musicOn = !musicOn; if (FA) FA.setVolume(musicOn ? VOL / 100 : 0); TRK.el.muted = !musicOn; $('bMus').textContent = musicOn ? '🎵 音樂' : '🔇 靜音'; dirty(); }

$('vid').addEventListener('ended', () => endCine());
$('vid').addEventListener('error', () => { const v = $('vid'); if (v.dataset.ready && !v.dataset.local) { delete v.dataset.ready; $('bVid').textContent = '🎬 選影片（影片檔讀不到）'; } });
$('cine').addEventListener('click', () => { const v = $('vid'); if (v.dataset.ready && v.paused) { $('cineHint').textContent = ''; const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } });
$('bVid').onclick = () => $('fVid').click();
$('fVid').onchange = e => { const f = e.target.files[0]; if (!f) return; const v = $('vid'); v.src = URL.createObjectURL(f); v.dataset.ready = '1'; v.dataset.local = '1'; $('bVid').textContent = '🎬 影片已載入'; };
if (C.introVideo) { const v = $('vid'); v.src = C.introVideo; v.dataset.ready = '1'; }
$('bTrk').onclick = () => $('fTrk').click();
$('fTrk').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { await TRK.setFile(f); } catch (err) { alert('音檔存不進瀏覽器：' + err.message); } };
$('bMus').onclick = () => { unlock(); toggleMusic(); };
$('bTalk').onclick = () => { unlock(); setTalk(!talk); };

// ================= 遊戲層 =================
const frames = {};
const GBTN = {
  coins: { start: { re: /開始/, key: 's' }, result: { re: /結算|關閉/, key: 'd' }, reset: { re: /重置/, key: 'r' } },
  truefalse: { score: { re: /積分模式/ }, elim: { re: /淘汰模式/ }, start: { re: /開始遊戲/, key: 's' }, reveal: { re: /公布結果/, key: 'p' }, next: { re: /下一題|排行榜|頒獎/, key: 'n' }, skip: { re: /跳過/, key: 'k' }, restart: { re: /重新開始/, key: 'r' } }
};
function loadGames() {
  for (const k in GAMES) {
    if (frames[k]) continue;
    const f = document.createElement('iframe');
    f.src = GAMES[k].url; f.allow = 'fullscreen; autoplay; clipboard-write'; f.title = GAMES[k].name;
    f.addEventListener('load', () => hookFrame(f));
    $('gameLayer').appendChild(f); frames[k] = f;
  }
}
// 修正：焦點在遊戲畫面裡時，← → / PageUp PageDown（簡報筆）也能控制流程
function hookFrame(f) {
  try {
    f.contentWindow.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase(), tag = ((e.target && e.target.tagName) || '').toLowerCase();
      if (/input|textarea|select/.test(tag)) return;
      if (k === 'g' || k === 'escape') { e.preventDefault(); e.stopPropagation(); closeGame(); }
      else if (k === 'arrowright' || k === 'pagedown') { e.preventDefault(); e.stopPropagation(); next(); }
      else if (k === 'arrowleft' || k === 'pageup') { e.preventDefault(); e.stopPropagation(); closeGame(); }
      else if (k === 't') { e.preventDefault(); setTalk(!talk); }
    }, true);
    f.contentDocument.querySelectorAll('audio,video').forEach(m => m.volume = VOL / 100);
  } catch (e) {}
}
function openGame() {
  const s = STAGES[idx]; if (!s.game || !frames[s.game]) return;
  inGame = true; opened.add(idx);
  for (const k in frames) frames[k].classList.toggle('cur', k === s.game);
  $('gameLayer').classList.add('on');
  if (s.game === 'truefalse') window.WeiyaHook('truefalse', 'lobby');
  setTimeout(() => { try { frames[s.game].focus(); frames[s.game].contentWindow.focus(); } catch (e) {} }, 100);
  dirty();
}
function closeGame() {
  if (!inGame) return;
  inGame = false; $('gameLayer').classList.remove('on');
  try { window.focus(); document.body.focus(); } catch (e) {}
  dirty();
}
$('gExit').onclick = closeGame;
const visible = el => { if (!el.getClientRects().length) return false; const cs = el.ownerDocument.defaultView.getComputedStyle(el); return cs.display !== 'none' && cs.visibility !== 'hidden' && +cs.opacity > 0.05; };
const btnText = b => (b.textContent || '').replace(/\s*\([A-Z]\)\s*$/, '').replace(/\s+/g, ' ').trim();
function findBtn(doc, re) { const list = [...doc.querySelectorAll('button,[role=button]')].filter(b => re.test(b.textContent || '')); return list.find(b => visible(b) && !b.disabled) || list.find(b => visible(b)) || list[0] || null; }
function gameAction(name) {
  const s = STAGES[idx], k = s.game, f = frames[k], def = GBTN[k] && GBTN[k][name];
  if (!f || !def) return 'none';
  let doc, win; try { doc = f.contentDocument; win = f.contentWindow; } catch (e) { return 'blocked'; }
  if (!doc) return 'none';
  let b = (k === 'coins' && name === 'result') ? ([...doc.querySelectorAll('button')].find(x => /關閉/.test(x.textContent) && visible(x)) || findBtn(doc, /結算/)) : findBtn(doc, def.re);
  if (b) { if (b.disabled) return 'disabled'; b.click(); return 'ok'; }
  if (def.key) { const K = def.key.toUpperCase(); (doc.body || doc.documentElement).dispatchEvent(new win.KeyboardEvent('keydown', { key: def.key, code: 'Key' + K, keyCode: K.charCodeAt(0), which: K.charCodeAt(0), bubbles: true, cancelable: true })); return 'key'; }
  return 'none';
}
function reloadGame() { const f = frames[STAGES[idx].game]; if (f) { try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } } }
let QS = [];
const norm = s => String(s || '').replace(/\s+/g, '');
const unesc = s => { try { return JSON.parse('"' + s + '"'); } catch (e) { return s; } };
async function loadQs() {
  const g = GAMES.truefalse; if (!g || !g.questions) return;
  try {
    const t = await (await fetch(g.questions, { cache: 'no-store' })).text();
    const re = /ans\s*:\s*(true|false)\s*,\s*zh\s*:\s*"((?:[^"\\]|\\.)*)"([\s\S]*?)(?=ans\s*:|$)/g; let m;
    while ((m = re.exec(t))) { const ex = /ex\s*:\s*\{\s*zh\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(m[3]); const zh = unesc(m[2]); QS.push({ ans: m[1] === 'true', zh, n: norm(zh), ex: ex ? unesc(ex[1]) : '' }); }
  } catch (e) {}
}
function glance() {
  const k = STAGES[idx].game, f = frames[k]; if (!f) return null;
  let doc; try { doc = f.contentDocument; } catch (e) { return null; }
  if (!doc || !doc.body) return null;
  const g = { game: k, btn: {} };
  try {
    const txt = doc.body.innerText || ''; let m;
    if ((m = /(\d+)\s*支手機/.exec(txt))) g.players = +m[1]; else if ((m = /(\d+)\s*(?:人|位)(?!數)/.exec(txt))) g.players = +m[1];
    if ((m = /總\s*([\d,]+)\s*下/.exec(txt))) g.taps = m[1];
    if (k === 'truefalse' && (m = /(?:已作答|作答)[^\d]{0,8}(\d+)\s*\/\s*(\d+)/.exec(txt))) g.answered = m[1] + ' / ' + m[2];
    if (/DEMO/.test(txt)) g.demo = 1;
    if (/請先按下方主持人登入|請先登入/.test(txt)) g.needLogin = 1;
    let best = null, bs = 44;
    for (const el of doc.body.querySelectorAll('*')) { if (el.childElementCount) continue; const t = (el.textContent || '').trim(); if (!/^\d{1,3}$/.test(t)) continue; const fs = parseFloat(doc.defaultView.getComputedStyle(el).fontSize) || 0; if (fs > bs && visible(el)) { bs = fs; best = t; } }
    if (best !== null) g.big = best;
    if (k === 'truefalse' && QS.length) { const nt = norm(txt); let q = null; for (const x of QS) if (x.n.length > 3 && nt.includes(x.n) && (!q || x.n.length > q.n.length)) q = x; if (q) { g.q = q.zh; g.ans = q.ans; g.ex = q.ex; } }
    for (const a in GBTN[k]) { const b = (k === 'coins' && a === 'result') ? ([...doc.querySelectorAll('button')].find(x => /關閉/.test(x.textContent) && visible(x)) || findBtn(doc, /結算/)) : findBtn(doc, GBTN[k][a].re); g.btn[a] = b ? { ok: !b.disabled, label: btnText(b) } : { ok: true, label: '' }; }
  } catch (e) {}
  return g;
}

// ================= 遙控 =================
let bus = null, lastBy = '', lastAct = '', ack = '', remotes = [];
let _dirty = true; function dirty() { _dirty = true; }
const ACT_NAME = { next: '下一段', prev: '上一段', goto: '跳段', fx: '煙火', music: '音樂開關', vol: '音量', game: '遊戲操作', openGame: '進入遊戲', exitGame: '回到流程', reloadGame: '重新載入遊戲', grand: '頭獎揭曉', award: '頒獎音樂', phase: '抽獎', talk: '講話模式', applause: '掌聲', bingo: '賓果提示音', mj: '麻將' };
function exec(c) {
  unlock();
  lastBy = c.by || ''; lastAct = ACT_NAME[c.a] || c.a; let r = 'ok';
  switch (c.a) {
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'goto': goto(c.v); break;
    case 'fx': FX.burstShow(2); break;
    case 'music': toggleMusic(); break;
    case 'vol': setVol(c.v); break;
    case 'openGame': if (!inGame) openGame(); break;
    case 'exitGame': closeGame(); break;
    case 'reloadGame': reloadGame(); break;
    case 'grand': if (typeOf(STAGES[idx]) === 'grand') grandStart(); else r = 'none'; break;
    case 'award': grandAward(); break;
    case 'phase': r = setPhase(c.v); lastAct = { ready: '回到準備', drawing: '開始抽獎', reveal: '揭曉' }[c.v] || c.v; break;
    case 'talk': setTalk(c.v == null ? !talk : !!c.v); break;
    case 'applause': applause(); break;
    case 'bingo': if (FA) FA.sfx.bingo(); break;
    case 'mj': r = mjOp(c.v && c.v.op, c.v && c.v.id); lastAct = '麻將・' + ({ add: '抽出', undo: '取消上一張', reset: '全部重置' }[c.v && c.v.op] || ''); break;
    case 'game': r = gameAction(c.v); if (c.v) lastAct = (GAMES[STAGES[idx].game] || {}).name + '・' + c.v; setTimeout(dirty, 300); break;
    default: r = 'unknown';
  }
  ack = c.id + ':' + r; dirty();
}
let lastPub = '';
function publish() {
  if (!bus) return;
  const s = STAGES[idx], ty = typeOf(s);
  const st = {
    idx, n: STAGES.length, type: ty, kind: s.kind || '', phase, tfStep, tfRules: (s.rules || []).length, gphase, talk,
    track: TRK.ok, note: s.note || '',
    stages: STAGES.map(x => ({ h: x.h || (x.round ? '第 ' + x.round + ' 輪抽獎' : ''), chip: x.chip, t: x.t || '', game: x.game || '', type: typeOf(x), by: x.by || '', prizes: x.prizes || [] })),
    inGame, cine: !!cine, opened: opened.has(idx), music: musicOn, audio: !!FA && FA.ready(), vol: VOL,
    mj: ty === 'board' ? mjDrawn : null,
    glance: s.game ? glance() : null, remotes, lastBy, lastAct, ack
  };
  const j = JSON.stringify(st);
  if (j === lastPub) return; lastPub = j; bus.publishState(st);
}
setInterval(() => { if (_dirty || STAGES[idx].game) { _dirty = false; publish(); } }, 400);

// ================= 鍵盤 =================
addEventListener('keydown', e => {
  if (!$('gate').classList.contains('off')) return;
  const k = e.key.toLowerCase();
  if ((k === ' ' || k === 'enter') && inGame) return;   // 遊戲中只有方向鍵／簡報筆能換段，避免誤按空白鍵離開遊戲
  if (k === 'arrowright' || k === ' ' || k === 'pagedown' || k === 'enter') { e.preventDefault(); next(); }
  else if (k === 'arrowleft' || k === 'pageup') { e.preventDefault(); prev(); }
  else if (k === 'g') { if (inGame) closeGame(); else if (STAGES[idx].game) openGame(); }
  else if (k === 'd') { unlock(); setPhase('drawing'); }
  else if (k === 'w') { unlock(); setPhase('reveal'); }
  else if (k === 'r' && typeOf(STAGES[idx]) === 'draw') { unlock(); setPhase('ready'); }
  else if (k === 't') { unlock(); setTalk(!talk); }
  else if (k === 'a') applause();
  else if (k === 'f') full();
  else if (k === 'b') FX.burstShow(2);
  else if (k === 'm') { unlock(); toggleMusic(); }
});
function full() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {} }
$('bNext').onclick = next; $('bPrev').onclick = prev; $('bFull').onclick = full;

// ================= 開始畫面：登入 → 點一下開始 =================
function badge() {
  const b = $('rbadge');
  if (!bus) { b.className = ''; b.querySelector('span').textContent = '遙控器未啟用'; return; }
  b.className = remotes.length ? 'ok' : '';
  b.querySelector('span').textContent = (bus.demo ? '試玩・' : '') + (remotes.length ? '遙控器 ' + remotes.length + ' 支' : '遙控器待連線');
}
function gateStart(info) {
  $('gbox').innerHTML = `<h2>尾牙主持大螢幕</h2><p class="ok">${info}</p><button class="pri" id="gGo">▶ 點一下開始</button><p>會自動全螢幕並開啟聲音（瀏覽器規定要先點一下）</p><p style="font-size:1.6vh;opacity:.7" id="gTrk">${TRK.ok ? '🎵 真的還假的音檔：已載入' : '🎵 真的還假的音檔：還沒載入（開始後右下角「🎵 載入音檔」選一次）'}</p>${bus && !bus.demo ? '<button class="sec" id="gOut">登出換帳號</button>' : ''}`;
  $('gGo').onclick = () => { unlock(); full(); $('gate').classList.add('off'); arrive(); dirty(); };
  if ($('gOut')) $('gOut').onclick = () => bus.logout();
}
function gateLogin(msg) {
  $('gbox').innerHTML = `<h2>尾牙主持大螢幕</h2><p>用主持人帳號登入，手機遙控器和遊戲才能用</p>
    <input id="gE" type="email" autocomplete="username" value="${esc(C.hostEmail || '')}" placeholder="Email">
    <input id="gP" type="password" autocomplete="current-password" placeholder="密碼">
    <div class="err" id="gErr">${esc(msg || '')}</div>
    <button class="pri" id="gIn">登入</button><button class="sec" id="gSkip">不用遙控，直接開始</button>`;
  const go = async () => { $('gErr').textContent = '登入中…'; try { await bus.login($('gE').value, $('gP').value); } catch (e) { $('gErr').textContent = /invalid|wrong|user-not-found/.test(e.code || '') ? '帳號或密碼不對' : /unauthorized-domain/.test(e.code || '') ? '網域沒加進 Firebase 授權網域' : '登入失敗：' + (e.code || e.message); } };
  $('gIn').onclick = go; $('gP').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('gSkip').onclick = () => { bus = null; badge(); loadGames(); gateStart('沒有登入：手機遙控器不能用，請用鍵盤操作'); };
}
let started = false;
(async function boot() {
  render(); loadQs();
  try { bus = await createBus(C, 'screen'); } catch (e) { bus = null; }
  if (!bus) { loadGames(); gateStart('遙控器連線失敗，請用鍵盤操作'); badge(); return; }
  bus.onUser(u => {
    if (!u) { if (!started) gateLogin(bus.loadError ? 'Firebase 載入失敗，改用試玩模式' : ''); else badge(); return; }
    const allowed = bus.demo || !C.remotes || Object.keys(C.remotes).map(x => x.toLowerCase()).includes((u.email || '').toLowerCase());
    if (!started) {
      started = true;
      if (allowed) { bus.listenCmds(exec); bus.screenPresence(); bus.onRemotes(list => { remotes = list; badge(); dirty(); }); }
      loadGames(); badge();
      gateStart(bus.demo ? '試玩模式：同一台電腦另開分頁打開 remote.html?demo 當遙控器' : `已登入 ${esc(u.email)} ✅` + (allowed ? '' : '<br>（這個帳號不在遙控名單，遙控器不能用）'));
    }
  });
})();
</script>
